name: CI

# Corre en cada pull request hacia main. Es la red de seguridad del flujo por
# branches: nada llega a main sin pasar formato, lint, tipos y build.
#
# En los pushes a main no se dispara solo: lo llama deploy.yml como primer
# paso (workflow_call), asi el sitio no se publica si la verificacion falla y
# no se corre dos veces por push.
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Si se pushea de nuevo a la misma rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Formato, lint, tipos y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run check

      - name: Build
        run: npm run build
